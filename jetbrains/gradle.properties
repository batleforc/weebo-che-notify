# Version du plugin, alignée sur l'extension VS Code (package.json) ;
# la CI la surcharge avec le tag via -PpluginVersion
pluginVersion=0.4.0

# La stdlib Kotlin est fournie par la plateforme IntelliJ : ne pas l'embarquer
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
